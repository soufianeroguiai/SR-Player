name: sr_player
description: SR Player - Advanced Video Player
publish_to: 'none'

version: 1.3.1+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # 🎬 Video Stack
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # 📁 File & Media
  file_picker: ^13.4.1
  photo_manager: ^3.12.0
  path_provider: ^2.1.6

  # 🔐 Permissions
  permission_handler: ^13.0.2

  # 🎞️ FFmpeg Extended
  ffmpeg_kit_extended_flutter: ^1.0.0

  url_launcher: ^6.3.3

  # 📦 State
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6

  # 🎨 UI
  material_symbols_icons: ^4.2960.0
  flex_color_picker: ^4.0.0
  google_fonts: ^9.0.0

  # ⚙️ Utilities
  share_plus: ^13.3.1
  wakelock_plus: ^1.8.2
  screen_brightness: ^2.1.11
  http: ^1.6.0
  
  # 📱 Sensors (للتدوير الذكي)
  sensors_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/

# تكوين FFmpeg Extended (ضبط البناء)
ffmpeg_kit_extended_config:
  type: "base" # pre-bundled builds: debug, base, full, audio, video, video_hw
  gpl: true # enable to include GPL libraries
  small: true # enable to use smaller builds
  # == OR ==
  # -------------------------------------------------------------
  # You can specify remote or local path to libffmpegkit libraries for each platform
  # This allows you to deploy custom builds of libffmpegkit.
  # See: https://github.com/akashskypatel/ffmpeg-kit-builders
  # -------------------------------------------------------------
  # windows: "path/to/ffmpeg-kit/libraries"
  # ios: "https://path/to/bundle.xcframework.zip"